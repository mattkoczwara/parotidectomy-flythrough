# Authored anatomy for the right side, in the canonical CT frame (ADR-0002): RAS, millimetres,
# +x = patient right (lateral on this side), +y = anterior, +z = superior.
#
# Nodes are either landmark references (pipeline/specs/landmarks.vhp-male.json) or explicit points with a
# rationale. Optional `snap` moves a node onto a segmented surface (nearest surface point, then offset along
# the outward normal). Segments are swept to tapered tubes along centripetal Catmull-Rom splines through their
# nodes. Every segment lists the claims it relies on; tools/validate checks the ids exist, and
# pipeline/anatomy/checks.py asserts the relationships in `checks` against the built geometry.
#
# The default facial-nerve pattern has no interconnections (a simplification: Davis type I is only ~15% of
# nerves, claim fn-branching-variation). Variant patterns are M2 work.

frame: vhp-male-normal-ct
side: right

nodes:
  smf: { landmark: stylomastoid_foramen }
  trunk_mid: { xyz: [51, 67, 250], why: "trunk runs anterolaterally and slightly inferiorly from the foramen, lateral to the styloid base" }
  pes: { xyz: [58.5, 71, 245], why: "trunk enters the posteromedial surface of the gland behind the ramus; bifurcation (pes) just inside it" }

  tf_1: { xyz: [64.5, 77, 249], why: "temporofacial division ascends anteriorly over the ramus/condylar neck" }
  tf_end: { xyz: [66, 80, 255], why: "temporofacial division fans into temporal and zygomatic branches within the upper gland" }
  temporal_1: { xyz: [67, 86, 263], why: "temporal branch ascends within the upper gland toward the zygomatic arch" }
  temporal_2: { xyz: [63, 98, 274], why: "crosses the zygomatic arch superficially, midway between tragus and lateral orbit", snap: { surface: zygomatic_region, offset_mm: 3 } }
  temporal_3: { xyz: [55, 112, 292], why: "continues toward the frontalis above the lateral brow" }
  zygomatic_1: { xyz: [67, 90, 257], why: "zygomatic branch runs forward just below the arch" }
  zygomatic_2: { xyz: [62, 108, 259], why: "over the masseter origin toward the lateral canthus", snap: { surface: masseter_r, offset_mm: 3 } }
  zygomatic_3: { xyz: [60, 122, 268], why: "over the body of the zygoma toward orbicularis oculi", snap: { surface: zygomatic_region, offset_mm: 4 } }

  cf_1: { xyz: [64, 76, 236], why: "cervicofacial division descends within the gland posterior to the ramus" }
  cf_end: { xyz: [64, 79, 228], why: "cervicofacial division gives buccal, marginal mandibular and cervical branches" }
  buccal_1: { xyz: [65, 88, 247], why: "buccal branch runs forward about 1 cm below the arch" }
  buccal_2: { xyz: [63, 102, 249], why: "over the masseter, roughly parallel to the arch", snap: { surface: masseter_r, offset_mm: 3 } }
  buccal_3: { xyz: [55, 120, 247], why: "toward buccinator and upper lip muscles" }
  mm_1: { xyz: [64, 83, 216], why: "marginal mandibular branch descends toward the mandibular angle" }
  mm_2: { xyz: [58, 93, 205], why: "runs along the lower border of the mandible near the angle", snap: { surface: masseter_r, offset_mm: 2.5 } }
  mm_3: { xyz: [48, 112, 199], why: "forward along the lower border toward the lower-lip depressors" }
  cervical_1: { xyz: [65.5, 78, 214], why: "cervical branch exits the lower pole of the gland" }
  cervical_2: { xyz: [66, 77, 195], why: "descends into the neck deep to platysma, superficial to the veins" }
  cervical_3: { xyz: [63, 80, 175], why: "toward platysma" }
  post_aur_1: { xyz: [58, 66, 242], why: "posterior auricular branch leaves the trunk and passes in front of the mastoid tip" }
  post_aur_2: { xyz: [67, 55, 254], why: "runs up and back over the anterior mastoid toward the auricular muscles", snap: { surface: zygomatic_region, offset_mm: 3 } }
  digastric_br: { xyz: [50, 62, 245], why: "branch to the posterior belly of the digastric" }

  # Great auricular nerve: over the sternocleidomastoid toward the ear lobe and gland.
  gan_1: { xyz: [66, 58, 150], why: "emerges at the posterior border of the SCM near its midpoint", snap: { surface: scm_r, offset_mm: 2 } }
  gan_2: { xyz: [70, 62, 180], why: "ascends obliquely over the SCM", snap: { surface: scm_r, offset_mm: 2 } }
  gan_div: { xyz: [74, 66, 204], why: "divides near the lower pole of the gland", snap: { surface: scm_r, offset_mm: 2 } }
  gan_ant: { xyz: [79, 84, 226], why: "anterior branch over the gland toward the skin of the angle and cheek" }
  gan_post: { xyz: [78, 66, 250], why: "posterior branch toward the ear lobe and mastoid skin" }

  # Interconnections between the divisions (variant patterns, Katz-Catalano types II-IV; claim fn-branching-variation).
  # Drawn as single twigs of typical position between existing branches; the real patterns are more varied.
  ic_a_mid: { xyz: [67.5, 89, 252], why: "twig joining the cheek branch to the eyelid branch where both leave the gland" }
  ic_b_mid: { xyz: [68.5, 104.5, 255], why: "twig joining the cheek and eyelid branches over the masseter" }
  ic_c_mid: { xyz: [66, 75.5, 242.5], why: "twig joining the two divisions just beyond the first split" }

  # Auriculotemporal nerve (V3): behind the neck of the mandible, between the ear canal and the condyle, then up beside the
  # superficial temporal vessels in front of the ear; its parotid branches carry the gland's secretomotor fibres (claim
  # auriculotemporal-course). Authored schematically from that description, not from the scan.
  at_0: { xyz: [57.5, 73, 260.5], why: "emerges behind the neck of the mandible, lateral to the retromandibular vein" }
  at_1: { xyz: [60.5, 72.5, 265.5], why: "between the ear canal and the mandibular condyle, behind the superficial temporal artery" }
  at_2: { xyz: [63, 71.8, 271], why: "turns upward in front of the ear" }
  at_3: { xyz: [66, 70.3, 284], why: "ascends beside the superficial temporal vessels" }
  at_4: { xyz: [67.5, 69.8, 295], why: "into the temple skin" }

  # Veins.
  rmv_top: { xyz: [54.5, 75, 257], why: "formed behind the mandibular neck by superficial temporal and maxillary veins, between the condyle and the ear canal" }
  rmv_1: { xyz: [56, 78, 243], why: "descends in the gland, medial (deep) to the nerve and lateral to the ECA" }
  rmv_2: { xyz: [57, 80, 222], why: "continues posterior to the ramus" }
  rmv_div: { xyz: [59, 81, 206], why: "divides near the lower pole of the gland" }
  rmv_ant: { xyz: [52, 96, 192], why: "anterior division joins the facial vein" }
  rmv_post: { xyz: [59, 73, 196], why: "posterior division joins the posterior auricular vein" }
  ejv_1: { xyz: [66, 76, 180], why: "external jugular vein descends over the SCM", snap: { surface: scm_r, offset_mm: 3 } }
  ejv_2: { xyz: [65, 70, 150], why: "crosses the SCM obliquely", snap: { surface: scm_r, offset_mm: 3 } }

  # Arteries.
  eca_1: { xyz: [22, 80, 168], why: "external carotid artery ascends from the carotid bifurcation" }
  eca_2: { xyz: [27, 79, 195], why: "passes deep (medial) to the posterior belly of the digastric and stylohyoid" }
  eca_3: { xyz: [37, 80, 222], why: "enters the deep surface of the gland" }
  eca_4: { xyz: [49, 80, 242], why: "ascends deep to the retromandibular vein, posterior to the ramus" }
  eca_div: { xyz: [50, 81, 252], why: "divides behind the mandibular neck" }
  maxillary_1: { xyz: [42, 86, 253], why: "maxillary artery passes anteromedially behind the condylar neck" }
  maxillary_2: { xyz: [32, 94, 255], why: "into the infratemporal fossa" }
  sta_0: { xyz: [60, 79, 257], why: "superficial temporal artery ascends behind the condylar neck, lateral to the vein" }
  sta_1: { xyz: [61, 78, 266], why: "ascends in front of the tragus, lateral to the vein" }
  sta_2: { xyz: [64, 75, 280], why: "crosses the root of the zygomatic arch, superficial to the temporal fascia", snap: { surface: zygomatic_region, offset_mm: 6 } }
  sta_3: { xyz: [63, 76, 298], why: "into the temporal region over temporalis", snap: { surface: zygomatic_region, offset_mm: 9 } }

  # Parotid (Stensen's) duct: forms in the anterior gland, leaves its anterior border, crosses the masseter's lateral
  # surface slightly above the tragus-mouth-corner line (Iwanaga 2026: 84% of 32 hemifaces) about a fingerbreadth below
  # the zygomatic arch, and pierces the buccinator at the masseter's anterior border (claim parotid-duct-course).
  duct_0: { xyz: [66, 94, 242], why: "the main duct forms in the anterior part of the gland and runs forward" }
  duct_1: { xyz: [70, 106, 237], why: "leaves the anterior border of the gland, superficial to the masseter", snap: { surface: masseter_r, offset_mm: 2.5 } }
  duct_2: { xyz: [68, 118, 236], why: "crosses the lateral surface of the masseter", snap: { surface: masseter_r, offset_mm: 2.5 } }
  duct_3: { xyz: [64, 129, 235], why: "turns medially at the anterior border of the masseter", snap: { surface: masseter_r, offset_mm: 2.0 } }
  duct_4: { xyz: [56, 138, 234], why: "pierces the buccinator toward the mouth; modelled to the buccinator, the rest lies outside the segmented volume" }
  acc_duct: { xyz: [69.5, 110, 240], why: "short tributary from the accessory lobule to the main duct" }

  # Nerve stimulator probe (an instrument, not anatomy): its tip rests on the lateral surface of the trunk and it leaves
  # the wound laterally through the space the retracted gland leaves, clear of the skull (claim stimulator-technique).
  stim_0: { xyz: [52.9, 66.3, 250.5], why: "tip touching the lateral surface of the trunk" }
  stim_1: { xyz: [62, 68, 251], why: "shaft crossing the space the retracted gland leaves" }
  stim_2: { xyz: [76, 70, 252], why: "shaft leaving the wound" }
  stim_3: { xyz: [92, 72, 253], why: "handle end" }

  # Muscle and bone authored because segmentation gave only fragments (ADR-0002).
  dig_origin: { landmark: digastric_origin }
  dig_1: { xyz: [46, 64, 230], why: "posterior belly runs anteroinferiorly, medial to the parotid tail" }
  dig_2: { xyz: [39, 75, 207], why: "lateral to the internal jugular vein and carotid" }
  dig_3: { xyz: [32, 85, 186], why: "toward the intermediate tendon at the hyoid" }
  dig_tendon: { xyz: [28, 89, 177], why: "intermediate tendon near the hyoid greater horn" }
  sty_base: { landmark: styloid_base }
  sty_tip: { landmark: styloid_tip }

snap_surfaces:
  masseter_r: head_muscles/masseter_right
  scm_r: headneck_muscles/sternocleidomastoid_right
  zygomatic_region: craniofacial_structures/skull

segments:
  - { id: facial_nerve_trunk, kind: nerve, path: [smf, trunk_mid, pes], radius: [1.33, 1.2], claims: [fn-exits-stylomastoid-foramen, fn-trunk-length, fn-trunk-diameter, landmark-styloid] }
  - { id: facial_nerve_temporofacial, kind: nerve, path: [pes, tf_1, tf_end], radius: [1.0, 0.9], claims: [fn-bifurcation] }
  - { id: facial_nerve_cervicofacial, kind: nerve, path: [pes, cf_1, cf_end], radius: [0.95, 0.85], claims: [fn-bifurcation] }
  - { id: facial_nerve_temporal, kind: nerve, path: [tf_end, temporal_1, temporal_2, temporal_3], radius: [0.65, 0.35], claims: [fn-five-branch-groups] }
  - { id: facial_nerve_zygomatic, kind: nerve, path: [tf_end, zygomatic_1, zygomatic_2, zygomatic_3], radius: [0.65, 0.35], claims: [fn-five-branch-groups] }
  - { id: facial_nerve_buccal, kind: nerve, path: [cf_end, buccal_1, buccal_2, buccal_3], radius: [0.65, 0.35], claims: [fn-five-branch-groups, buccal-branch-course] }
  - { id: facial_nerve_marginal_mandibular, kind: nerve, path: [cf_end, mm_1, mm_2, mm_3], radius: [0.6, 0.3], claims: [fn-five-branch-groups] }
  - { id: facial_nerve_cervical, kind: nerve, path: [cf_end, cervical_1, cervical_2, cervical_3], radius: [0.6, 0.3], claims: [fn-five-branch-groups] }
  - { id: facial_nerve_posterior_auricular, kind: nerve, path: [trunk_mid, post_aur_1, post_aur_2], radius: [0.45, 0.3], claims: [fn-exits-stylomastoid-foramen] }
  - { id: facial_nerve_digastric_branch, kind: nerve, path: [trunk_mid, digastric_br], radius: [0.35, 0.3], claims: [fn-exits-stylomastoid-foramen] }
  - { id: great_auricular_nerve, kind: nerve, path: [gan_1, gan_2, gan_div], radius: [0.9, 0.8], claims: [great-auricular-nerve-course] }
  - { id: great_auricular_nerve_anterior, kind: nerve, path: [gan_div, gan_ant], radius: [0.6, 0.4], claims: [great-auricular-nerve-course] }
  - { id: great_auricular_nerve_posterior, kind: nerve, path: [gan_div, gan_post], radius: [0.6, 0.4], claims: [great-auricular-nerve-course] }
  - { id: facial_nerve_ic_buccal_a, kind: nerve, path: [buccal_1, ic_a_mid, zygomatic_1], radius: [0.38, 0.38], claims: [fn-branching-variation] }
  - { id: facial_nerve_ic_buccal_b, kind: nerve, path: [buccal_2, ic_b_mid, zygomatic_2], radius: [0.36, 0.36], claims: [fn-branching-variation] }
  - { id: facial_nerve_ic_divisions, kind: nerve, path: [cf_1, ic_c_mid, tf_1], radius: [0.4, 0.4], claims: [fn-branching-variation] }
  - { id: auriculotemporal_nerve, kind: nerve, path: [at_0, at_1, at_2, at_3, at_4], radius: [0.6, 0.4], claims: [auriculotemporal-course] }
  - { id: retromandibular_vein, kind: vein, path: [rmv_top, rmv_1, rmv_2, rmv_div], radius: [2.4, 3.0], claims: [fn-lateral-to-retromandibular-vein, eca-rmv-in-gland] }
  - { id: retromandibular_vein_anterior, kind: vein, path: [rmv_div, rmv_ant], radius: [2.4, 2.2], claims: [eca-rmv-in-gland] }
  - { id: retromandibular_vein_posterior, kind: vein, path: [rmv_div, rmv_post, ejv_1], radius: [2.4, 2.8], claims: [eca-rmv-in-gland] }
  - { id: external_jugular_vein, kind: vein, path: [ejv_1, ejv_2], radius: [2.8, 3.0], claims: [great-auricular-nerve-course] }
  - { id: external_carotid_artery, kind: artery, path: [eca_1, eca_2, eca_3, eca_4, eca_div], radius: [3.0, 2.2], claims: [eca-rmv-in-gland] }
  - { id: maxillary_artery, kind: artery, path: [eca_div, maxillary_1, maxillary_2], radius: [1.6, 1.3], claims: [eca-rmv-in-gland] }
  - { id: superficial_temporal_artery, kind: artery, path: [eca_div, sta_0, sta_1, sta_2, sta_3], radius: [1.5, 1.0], claims: [eca-rmv-in-gland] }
  - { id: parotid_duct, kind: duct, path: [duct_0, duct_1, duct_2, duct_3, duct_4], radius: [1.3, 1.4], claims: [parotid-duct-course] }
  - { id: stimulator_probe, kind: instrument, path: [stim_0, stim_1, stim_2, stim_3], radius: [0.45, 1.7], claims: [stimulator-technique] }
  - { id: digastric_posterior_belly, kind: muscle, path: [dig_origin, dig_1, dig_2, dig_3, dig_tendon], radius: [5.0, 2.0], claims: [landmark-posterior-belly-digastric] }
  - { id: styloid_process, kind: bone, path: [sty_base, sty_tip], radius: [2.4, 0.7], claims: [landmark-styloid] }

# Functional direction of the directional cue (presentation only: the stage's travelling pulse, materials.ts). The
# geometry carries an unsigned tree distance from each tree's root (`arc`, mm); `forward` = the cue travels in path
# order, `reverse` = against it. Segments not listed carry no direction and no cue. Speeds are illustrative.
flows:
  root_why:
    facial_nerve_trunk: "motor (efferent): impulses travel from the stylomastoid foramen out to the facial muscles"
    great_auricular_nerve: "cutaneous sensory (afferent): impulses travel from the ear lobe and parotid skin toward the cervical plexus"
    external_carotid_artery: "arterial: from the carotid bifurcation toward the terminal branches"
    retromandibular_vein: "venous drainage: down from the union of the superficial temporal and maxillary veins"
  forward: [facial_nerve_trunk, facial_nerve_temporofacial, facial_nerve_cervicofacial, facial_nerve_temporal, facial_nerve_zygomatic,
    facial_nerve_buccal, facial_nerve_marginal_mandibular, facial_nerve_cervical, facial_nerve_posterior_auricular, facial_nerve_digastric_branch,
    external_carotid_artery, maxillary_artery, superficial_temporal_artery,
    retromandibular_vein, retromandibular_vein_anterior, retromandibular_vein_posterior, external_jugular_vein]
  reverse: [great_auricular_nerve, great_auricular_nerve_anterior, great_auricular_nerve_posterior]
  # Not listed, deliberately: the interconnecting twigs (no defensible direction between two motor branches) and the
  # auriculotemporal nerve (mixed: sensory afferents and secretomotor efferents in one trunk).

checks:
  trunk_length_mm: { segment: facial_nerve_trunk, claim: fn-trunk-length, range: [8.6, 22.8] }
  pes_inside_parotid: { node: pes, mask: head_glands_cavities/parotid_gland_right, max_outside_mm: 2 }
  # Applies inside the gland, where the nerve crosses the vein; the trunk runs posterior to the vein before it enters.
  nerve_lateral_to_rmv: { nerve: [facial_nerve_trunk, facial_nerve_temporofacial, facial_nerve_cervicofacial], vessel: retromandibular_vein, within_mask: head_glands_cavities/parotid_gland_right, claim: fn-lateral-to-retromandibular-vein }
  eca_deep_to_rmv: { deep: external_carotid_artery, superficial: retromandibular_vein, claim: eca-rmv-in-gland }
  eca_deep_to_digastric: { deep: external_carotid_artery, superficial: digastric_posterior_belly, claim: eca-rmv-in-gland }
  branch_order_superior_to_inferior: { at_y: 100, order: [facial_nerve_temporal, facial_nerve_zygomatic, facial_nerve_buccal, facial_nerve_marginal_mandibular] }
  mm_near_mandible_border: { segment: facial_nerve_marginal_mandibular, mask: craniofacial_structures/mandible, max_mm: 12 }
  temporal_superficial_to_arch: { segment: facial_nerve_temporal, mask: craniofacial_structures/skull }
  no_bone_intersection: { kinds: [nerve, vein, artery, muscle, duct, instrument], masks: [craniofacial_structures/skull, craniofacial_structures/mandible], allow_near: [smf, sty_base, dig_origin, stim_0] }
  landmark_distances:
    tympanomastoid_dropoff: { claim: landmark-tympanomastoid-suture, ranges: { witt-2005: [0, 4], rea-2010: [1.7, 3.3], pather-osman-2006: [4.9, 18.6] } }
    digastric_origin: { claim: landmark-posterior-belly-digastric, ranges: { witt-2005: [5, 17], rea-2010: [1.3, 9.7], pather-osman-2006: [9.7, 24.3] } }
    styloid_base: { claim: landmark-styloid, ranges: { pather-osman-2006: [4.3, 18.6] } }
    # Sources disagree five-fold and the claim is classed 'uncertain': reported for review, not asserted.
    tragal_pointer: { claim: landmark-tragal-pointer, ranges: { rea-2010: [3.3, 10.5], pather-osman-2006: [24.3, 49.2] }, assert: false }
  superficial_fraction: { claim: parotid-lobes-surgical, range: [0.55, 0.75] }
  # The duct runs on the outer surface of the masseter (outside it) once clear of the gland, below the zygomatic arch.
  duct_course: { segment: parotid_duct, masseter: head_muscles/masseter_right, skull_mask: craniofacial_structures/skull, min_below_arch_mm: 8, claim: parotid-duct-course }
  graph_connected_single_root: { root: smf }
  no_tube_contacts: { allow: [[facial_nerve_digastric_branch, digastric_posterior_belly], [stimulator_probe, facial_nerve_trunk]] }

# Tissue layers: closed depth bands below the skin (mm), restricted to the right face and upper neck.
# Representative thicknesses for the slice; to be refined against CT (fat/SMAS) in M2.
layers:
  skin_mm: 2.0
  smas_depth_mm: 7.0
  fat_min_mm: 2.0           # the fat continues over the superficial gland as a sheet at least this thick (no hole)
  smas_thickness_mm: 1.3
  field_box: { x_min: 20, y: [-15, 170], z: [150, 318] }   # right face and upper neck (mm); reaches above the incision's upper end so the raised flap carries its fat
  thick_open_iter: 5          # layer bands only where the head is thicker than about 8 mm (excludes the auricle)

# Pleomorphic adenoma: a lobulated mass of about 1.8 cm in the superficial lobe, placed in the gland's thickest
# lateral part below the level of the temporofacial division. A small superficial-lobe tumour is the case where the
# choice between extracapsular dissection and superficial parotidectomy is discussed (Salzano 2025 selection
# criteria). Size and position are authored for teaching, not taken from imaging. Acceptance thresholds were set
# before placement: nerve clearance >= 1.5 mm, >= 90% lateral to the nerve plane, >= 75% within the gland
# (a superficial-lobe tumour commonly bulges from the lateral surface).
tumour:
  center: [72.5, 84, 231]
  radii: [6.5, 8.5, 8.0]
  seed: 23
  min_nerve_clearance_mm: 1.5
  min_within_gland: 0.75

# Deep-lobe completion. The segmented gland stops at the posterior border of the ramus, and this cadaver CT does
# not separate retromandibular gland from fat (QC: lobe_split_axial.png): intensity-based growth left the
# retromandibular vein outside the gland. The retromandibular (deep) portion is therefore an authored region
# with anatomical bounds, not an intensity segmentation. It is labelled as such in the QC log.
deep_lobe_completion:
  medial_limit_x: 44          # lateral to the styloid process and the internal jugular vein
  ramus_margin_mm: 0.5         # stays posterior to the posterior border of the ramus
  z_range: [206, 256]          # below the ear-canal floor, above the gland's lower pole
  max_mm_from_segmented: 10
  exclude:
    - craniofacial_structures/mandible
    - craniofacial_structures/skull
    - head_muscles/masseter_right
    - head_muscles/medial_pterygoid_right
    - head_muscles/lateral_pterygoid_right
    - headneck_muscles/sternocleidomastoid_right
    - headneck_bones_vessels/internal_jugular_vein_right
    - head_glands_cavities/submandibular_gland_right
    - head_glands_cavities/auditory_canal_right
  exclude_authored: [digastric_posterior_belly, styloid_process]
  authored_margin_mm: 1.0
  # The authored digastric is an axis with a nominal 5 mm radius; the CT shows muscle-density tissue 2-4 mm
  # beyond it (QC log 2026-09-28, cryosection a_vm1175 agrees). Keep that tissue out of the gland.
  muscle_exclusion:
    around: [digastric_posterior_belly]
    hu_min: 20                 # between gland (median 3 HU) and muscle (median 37-39 HU) in this CT
    reach_mm: 6
    max_dense_fraction: 0.2    # check: share of deep-lobe voxels within 4 mm of the belly at muscle density

# Modified Blair incision and anterior skin flap (flap.py; claims incision-modified-blair, flap-plane). Control
# points are (A, S) mm in the right lateral projection, placed on the fitted skin in the picking view
# (pipeline/segment/work/flap/lateral.png): preauricular crease -> around the lobule onto the mastoid -> down
# behind the angle -> forward in a neck crease about two fingerbreadths below the mandible. Representative, not
# universal; the facelift variant is out of M1 scope.
incision:
  points: [[82, 281], [81.5, 263], [80.5, 247], [78, 235], [72, 226.5], [64, 223.5], [57.5, 225], [56.5, 213], [62, 198], [74, 185], [94, 177], [116, 176.5]]
  flap_side: 1              # positive signed distance (left of travel) is the flap
  x_min: 30                 # right lateral surface only
  axis_offset_mm: 28        # fold axis: parallel to the incision's chord, this far in front of it (beyond the
                            # anterior border of the gland, so the whole gland surface is exposed)
  ramp_mm: 20               # flap weight rises from 0 at the axis to 1 over this distance
  end_cap_mm: 12            # skin past each end of the incision stays attached (a gentle stretch, not a tear)
  fat_reach_mm: 20          # fat takes its flap membership from skin within this distance
  smooth_passes: 60         # diffusion of the lateral/auricle factors over the mesh (no torn triangles)
  fat_normal_passes: 20     # smoothing of the raised flap fat's normals (removes voxel terraces from the shading)
  # Fullness over the tumour (plate 1): the adenoma's lateral surface lies about 4-5 mm under the skin. Authored
  # for teaching, like the tumour itself; not measured.
  lump: { amplitude_mm: 2.2, radius_mm: 13 }
  ear_radius_mm: 30
  auricle_lift_mm: 3        # auricle = skin standing more than this proud of the head surface beneath the ear
  max_angle_rad: 2.4        # flap folded forward over the cheek at full retraction (about 138 degrees)
  edge_mm: [0.9, 1.8]       # local mesh refinement: within 6 mm of the incision, and over the rest of the flap
  view: { a: [40, 140], s: [165, 295] }

# Facelift-type alternative incision (ink only; claim facelift-incision): the same preauricular crease, then round the
# lobule and up the postauricular sulcus toward the hairline instead of down into the neck. Control points (A, S) mm in
# the same lateral picking view as above. One representative path (Movassaghi 2019 describes the technique); surgeons vary.
incision_facelift:
  points: [[82, 281], [81.5, 263], [80.5, 247], [78, 235], [72, 226.5], [64, 222.5], [56.5, 224], [50.5, 231], [46, 241], [44, 252], [44.5, 263], [46.5, 273], [48, 281], [44.5, 288], [40, 292]]

# Face replacement (face.py): a generic MakeHuman/MPFB head (CC0) replaces the CT donor's skin. It is conformed to
# the CT skin only over the anatomy of the dissection (right preauricular, parotid, cheek and upper neck) so the
# tissue layers stay consistent; the central face keeps MPFB's generic features.
face:
  depth_check_exclude: [stimulator_probe, frey_regrowth, needle, us_probe, us_plane, ct_tumour_outline, drain_tube, smas_flap, barrier_graft, sialocele_pocket, recurrence_nodules, pleomorphic_adenoma_accessory]   # instruments and schematic overlays (props.py, extras.py)
  mpfb_macro: { gender: male, age_old_weight: 0.23 }   # MakeHuman macro modifiers: an adult male of about 40 (young 25 → old 90), ancestry mixed equally (generic face)
  mpfb_body_cut_dm: 4.7          # keep MPFB vertices above this height (decimetres): the head, and below the scene cut the exterior body down to the upper chest
  body_fade_mm: 90               # the head-fit envelope fades out over this distance below the scene cut (exterior body only)
  mouth_lining_mm: 8             # MPFB's mouth lining is kept within this depth of the face surface and capped (it otherwise reaches the deep lobe; acceptance audit 2026-10-05)
  mouth_interior_mm: 3           # vertices deeper than this inside the head form the lining's connected region
  neck_cut_z: 140                # CT-frame lower limit used for fitting (mm)
  ct_vertex_gap_mm: 11           # the CT starts at slice 1012, about 11 mm below the VHP vertex reference
  conform_center: [66, 80, 218]  # right parotid region, centred low enough to cover the lower pole and upper neck
  conform_full_mm: 62
  conform_zero_mm: 98
  midline_x: [8, 30]             # weight rises from the midline laterally (mm)
  max_offset_mm: 30               # the cadaver jaw angle lies >15 mm outside the generic head
  offset_smoothing_iters: 6
  ear_level_z: 265                # ear-canal height (mm), from the EAC landmark
  ear_radius_mm: 30      # Laplacian smoothing of the normal offset (removes donor micro-features)
  skin_thickness_mm: 2.0
  envelope_smoothing: 400.0      # heavy: gross head shape only (cranium and jaw), not facial features
  envelope_max_offset_mm: 30
  scene_cut_z: 150               # one horizontal cut for skin and anatomy at the upper neck (mm)
  face_region: { y_min: 105, x_half: 50, z: [170, 305] }   # generic features kept here (no envelope)
  min_anatomy_depth_mm: 2.0
  min_bone_depth_mm: 1.0
  coverage_mm: 3.0               # skin kept at least this far outside segmented bone and muscle
  coverage_masks:
    - craniofacial_structures/skull
    - craniofacial_structures/mandible
    - head_muscles/masseter_right
    - head_muscles/temporalis_right
    - headneck_muscles/sternocleidomastoid_right
    - headneck_bones_vessels/internal_jugular_vein_right
    - head_glands_cavities/parotid_gland_right          # skin must cover the skull and mandible everywhere in the scene
  coverage_meshes: [great_auricular_nerve, great_auricular_nerve_anterior, great_auricular_nerve_posterior, external_jugular_vein, superficial_temporal_artery, auriculotemporal_nerve, temporalis_r]   # authored superficial structures the skin must also cover

# Exterior presentation (exterior.py): no anatomy and no claims. A short, controlled haircut and eyebrows drawn as
# shells over the fitted scalp, and a regional skin tint. The hairline keeps the ear, the preauricular skin and the
# parotid region clear (checked). Heights in mm relative to the eye centre ("eye") or the ear canal ("ear");
# azimuth about a vertical axis through the ear canals, 0 = front, 90 = side, 180 = back.
exterior:
  hairline:
    # Sides: hairline height by front-back position (mm from the ear canal, + anterior): behind the ear, over the ear,
    # the sideburn in front of it, the temple edge rising to the forehead corner.
    y:   [-130, -90, -60, -35, -20, 0, 15, 35, 50, 58, 64, 70, 140]
    ref: [ear, ear, ear, ear, ear, ear, ear, ear, ear, eye, eye, eye, eye]
    dz:  [-42, -38, -20, -2, 10, 16, 10, 8, 16, 30, 50, 66, 66]
    front_dz: 66          # the forehead hairline above the eye centre
    side_from_mm: [30, 50]   # |x| (mm from the midline) over which the front hairline gives way to the side one
  hairline_soft_mm: 11
  ear_clear_mm: [5, 9]        # hair fades out between these distances from the auricle
  parotid_clear_mm: 40        # no hair within this distance of the parotid region centre (face.conform_center)
  top_mm: 10                  # hair length on the crown; the sides are tapered
  side_mm: 4.5
  brow_mm: 2.2
  brow: { medial_mm: 20, lateral_mm: 24, height_mm: 12, arch_mm: 4, tail_drop_mm: 3, half_medial_mm: 5.2, half_tail_mm: 2.4 }   # eyebrows, relative to each eye centre
  lash_mm: 2.2                # upper lash line: skin within this distance of the eye
  part_spread: 0.25           # combed back, falling a little away from the midline
  comb_down: 0.35
  side_down: 0.9

# The opening's portrait (portrait.py): presentation only, no anatomy and no claims. A leaner, athletic version of
# the same generic exterior (the owner's goal reference), stored as a morph that settles into the fitted exterior
# before any anatomy shows. MakeHuman macro values 0..1 (0.5 = average), the same CC0 archive.
portrait:
  mpfb_macro:
    gender: male
    age_old_weight: 0.12      # early thirties (young 25 → old 90)
    muscle: 1.0
    weight: 0.4
    proportions: 1.0          # MakeHuman's "ideal" proportions
    ancestry: { caucasian: 0.7, african: 0.15, asian: 0.15 }   # weighted toward the owner's goal reference
    targets:
      neck/neck-double-decr: 1.0
      torso/torso-vshape-incr: 0.4
      chin/chin-prominent-incr: 0.35
      chin/chin-bones-incr: 0.25
      cheek/r-cheek-bones-incr: 0.2
      cheek/l-cheek-bones-incr: 0.2
      chin/chin-jaw-drop-incr: 0.25
      head/head-fat-decr: 0.5
      head/head-square: 0.1
      nose/nose-scale-depth-incr: 0.35
      nose/nose-scale-vert-incr: 0.25
      nose/nose-point-width-decr: 0.3
      chin/chin-height-incr: 0.4
      mouth/mouth-lowerlip-volume-incr: 0.25
      forehead/forehead-trans-backward: 0.3
      eyes/r-eye-height2-incr: 0.8
      eyes/l-eye-height2-incr: 0.8
      eyes/r-eye-scale-incr: 0.25
      eyes/l-eye-scale-incr: 0.25
      eyebrows/eyebrows-trans-forward: 0.6
      cheek/r-cheek-inner-decr: 0.4
      cheek/l-cheek-inner-decr: 0.4
      mouth/mouth-cupidsbow-incr: 0.4
      mouth/mouth-laugh-lines-in: 0.3
      nose/nose-hump-incr: 0.15
      ears/r-ear-scale-incr: 0.15
      ears/l-ear-scale-incr: 0.15
      neck/measure-neck-circ-incr: 1.0
      neck/measure-neck-height-decr: 0.6
      neck/neck-scale-depth-incr: 0.5
      neck/neck-back-scale-depth-incr: 0.5
  normal_smoothing_iters: 2   # the portrait normals, smoothed over the surface (shading only)
  # Muscle and bone relief of the neck and shoulder (portrait.py relief(); drawn by the stage): polylines between
  # landmark offsets (mm, RAS: +x the patient's right, +y anterior, +z up), with height (mm, negative = a hollow)
  # and width. M mastoid, S sternal notch, A acromion, L laryngeal prominence, N nape, E ear canal.
  relief:
    mastoid_offset_mm: [-6, -16, -36]
    acromion_x_mm: 175
    segments_per_muscle: 4      # the stage takes the distance to each muscle's whole polyline (blocks of this size)
    notch_above_acromion_mm: -14
    larynx_at: 0.5
    nape_below_ear_mm: 55
    muscles:
      - { name: scm_sternal, amp_mm: 2.4, sigma_mm: 11, path: [[M, [0, 0, 0]], [S, [12, 6, 30]], [S, [7, 0, 6]]] }
      - { name: scm_clavicular, amp_mm: 1.2, sigma_mm: 10, path: [[M, [0, -4, -18]], [S, [32, -6, 22]], [S, [30, -10, 0]]] }
      - { name: scm_groove, amp_mm: -0.8, sigma_mm: 9, path: [[M, [0, 20, -22]], [S, [8, 14, 40]]] }
      - { name: clavicle, amp_mm: 1.8, sigma_mm: 6, path: [[S, [14, -2, 0]], [A, [-45, 4, -2]], [A, [-22, -2, -4]]] }
      - { name: supraclavicular, amp_mm: -1.8, sigma_mm: 12, path: [[S, [40, -24, 18]], [A, [-38, -22, 10]]] }
      - { name: trapezius, amp_mm: 4.2, sigma_mm: 16, path: [[N, [18, 4, -10]], [A, [-55, -38, 26]], [A, [-14, -24, 6]]] }
      - { name: larynx, amp_mm: 3.0, sigma_mm: 6, path: [[L, [0, 0, 6]], [L, [0, 0, -6]]] }
      - { name: deltoid, amp_mm: 2.4, sigma_mm: 22, path: [[A, [4, 6, -28]], [A, [4, 6, -30]]] }
  cavity: { samples: 160000, neighbours: 64, radius_mm: 5.0, from_mm: 0.15, to_mm: 1.2 }   # creases: depth below the local mean surface
  # The hero key light's shadow, baked (portrait.py; the stage has no shadow maps): its direction is stage.ts LOOKS.hero
  # keyDir in RAS (glTF x, y, z = -RAS x, RAS z, RAS y). Packed with the cavity: half the cavity or the shadow.
  key_shadow: { dir_ras: [0.55, 0.63, 0.55], cell_mm: 2.0, bias_mm: 3.0, soft_mm: 12.0, smooth_iters: 12, strength: 0.85 }
  # Torso turned toward the viewer under a profile head, and the shoulders lowered from the rest pose (mm, RAS).
  pose: { neck_z: 150, twist_deg: 4, twist_full_z: 70, twist_zero_z: 140, shoulder_drop_mm: 30, drop_from_mm: [40, 130], torso_back_mm: 40, head_pitch_deg: 7, head_pitch_pivot_dz: 70, head_pitch_ramp_mm: 60, head_drop_mm: 12 }
  # Beard shadow (stubble): below a line given by height above the eye centre against mm in front of the ear canal
  # (the sideburn's foot, the cheek, the mouth corner), down to the neck line; the front of the neck under the jaw.
  stubble:
    line_y: [-5, 10, 30, 55, 75, 95]
    line_dz: [-22, -28, -38, -48, -52, -46]
    soft_mm: 14
    front_from_mm: -2
    neck_dz: -150
  # The portrait's haircut (groom.py): short and textured, longer and lifted on top, tapered to a fade over the ears
  # and at the nape. Hairline heights in mm relative to the eye centre ("eye") or the ear canal ("ear") against mm in
  # front of the ear canal; the ear and the parotid region are kept clear as for the fitted haircut.
  hair:
    hairline:
      y:   [-130, -100, -70, -45, -25, -8, 6, 14, 24, 34, 42, 47, 52, 58, 68, 140]
      ref: [ear, ear, ear, ear, ear, ear, ear, ear, ear, ear, ear, ear, eye, eye, eye, eye]
      dz:  [-72, -70, -62, -44, 6, 26, 22, 4, -1, -3, -5, 18, 40, 52, 62, 70]
      front_dz: 70
      side_from_mm: [30, 50]
    hairline_soft_mm: 10
    ear_clear_mm: [5, 9]
    top_mm: 34               # the front of the top
    crown_mm: 16
    side_mm: [5, 15]          # from the faded nape and temples to the upper sides
    top_from_dz: [38, 80]    # height above the ear canal over which the sides become the top
    brow_mm: 2.8
    brow: { medial_mm: 20, lateral_mm: 26, height_mm: 12, arch_mm: 3, tail_drop_mm: 3, half_medial_mm: 6.5, half_tail_mm: 3.6 }
    part_spread: 0.3
    comb_down: 0.2
    side_down: 0.85
    front_lift: 1.0
    shell_fraction: 0.45     # the shell under-layer's length as a share of the hair's (capped)
    shell_max_mm: 3.5
    whorl: { behind_ear_mm: [-75, -40], radius_mm: 38, strength: 0.7 }   # the crown whorl (mm from the ear canal, front-back)
    shell_min_mm: 3.5
    groom:
      seed: 20261005
      envelope: { azimuth_deg: [2, 8], elevation_deg: [0, 2], min_facing: -0.35 }   # plate 1 and the transition to plate 2
      min_len_mm: 5.0
      clumps: 750
      cards: 6500
      points: 5
      rise_t: 0.45
      settle: 0.35
      root_lift_mm: 0.4
      inertia: 0.7
      lift_top: 0.35          # height above the scalp as a share of the length
      lift_side: 0.3
      clump_converge: 0.88
      clump_radius_mm: 6.0
      tuft_fraction: 0.08
      tuft_length: 1.3
      tuft_lift: 1.5
      flyaway_fraction: 0.015
      flyaway_length: 1.2
      flyaway_lift_mm: 2.5
      layer_mm: 3.0
      wave_mm: 0.7
      turn_deg: 22            # locks turned off the comb direction (more on top: texture)
      wave_cycles: 0.8
      width_mm: 2.0
      taper: 0.6

# The opening's hero portrait (hero_prep.py, then pipeline/blender/hero.py; presentation only, no claims): a separate
# asset authored from Blender Studio's Human Base Meshes (CC0, pipeline/sources/human-base-meshes-1.4.1.json), which
# hands off to the fitted exterior before any anatomy shows. The goal reference is art direction, not a likeness.
hero:
  source:
    blend: pipeline/sources/raw/human-base-meshes/extracted/human-base-meshes-bundle-v1.4.1/human_base_meshes_bundle.blend
    object: GEO-body_male_realistic
    eyes: [GEO-body_male_realistic.eye.L, GEO-body_male_realistic.eye.R]
  web_level: 2              # multires level of the realtime mesh
  high_level: 3             # multires level the detail is baked from
  place:                    # on the fitted eyes: scale from their distance (times `scale`), then pitch and offset
    scale: 1.0
    pitch_deg: 0.0          # positive tips the face up
    yaw_deg: 7.0            # the finished figure turned toward the viewer (the goal reference's three-quarter hint)
    offset_mm: [0, 0, 0]    # Blender frame: +x left, -y anterior, +z up
  # Authored shape edits, applied alike to the realtime and the bake meshes (hero.py `edit`). Positions are mm from
  # the eyes' midpoint: lat (toward the patient's left), ant (anterior), up. Weights ramp with smoothstep between
  # the listed heights.
  edits:
    # an upright neck over the shoulders (the figure carries its head forward): the torso turns forward about the
    # neck's base
    torso_pitch: { deg: 16, pivot: [-110, -170], full_below: -190, none_above: -115 }
    # a longer skull behind the ears
    occiput: { mm: 8, from_ant: -70, full_ant: -150, from_up: -75, full_up: -25 }
    # larger ears, a little higher and further back (about the helix's centroid; blended out over the radius)
    ears: { scale: 1.13, raise_mm: 4, back_mm: 4, radius_mm: 42, tilt_deg: 9 }   # tilt: the top forward
    # Local sculpt toward the reference's art direction (not a likeness): Gaussian moves at [lat, ant, up] with a
    # radius (mm) by [lat, ant, up] mm; `sym` mirrors one about the midline (lat flips sign for both).
    blobs:
      - { at: [0, 19, -95], r: 15, by: [0, 4.5, -2.0] }      # chin: forward, a little longer
      - { at: [0, 20, -107], r: 12, by: [0, 2.0, -1.5] }     # its underside, squared
      - { at: [0, 29, -67], r: 11, by: [0, -2.2, 0] }        # lips back
      - { at: [0, 37, -33], r: 9, by: [0, 2.0, -2.5] }       # nasal tip: longer, a touch down
      - { at: [0, 24, -12], r: 9, by: [0, 1.5, 0] }          # nasal dorsum raised
      - { at: [0, 20, 16], r: 12, by: [0, 1.5, 0] }          # glabella
      - { at: [22, 17, 17], r: 13, by: [0, 2.5, 0.5], sym: true }     # brow ridges
      - { at: [44, 2, -18], r: 15, by: [2.0, 1.0, 0.5], sym: true }   # cheekbones
      - { at: [58, -52, -82], r: 17, by: [3.0, -1.5, -3.0], sym: true }  # jaw angles: wider, lower, sharper
      - { at: [0, -12, -118], r: 20, by: [0, 0, 3.0] }       # under the chin: lean
      # a broad athletic neck: the throat and the sternocleidomastoids forward, the nape and the trapezius back and up
      - { at: [0, -35, -150], r: 32, by: [0, 20, 0] }
      - { at: [40, -40, -145], r: 30, by: [6, 12, 0], sym: true }
      - { at: [0, -160, -125], r: 28, by: [0, -12, 0] }
      - { at: [55, -160, -150], r: 42, by: [5, -11, 3], sym: true }
      - { at: [0, -150, -100], r: 24, by: [0, -6, 0] }
      - { at: [30, 13, 8], r: 8, by: [0, 1.0, -1.2], sym: true }     # upper lids: a fuller fold over the globe
      - { at: [30, 16, 14], r: 9, by: [0, 1.6, -0.6], sym: true }    # the brow's overhang above it
    # the globes set deeper under the brow (mm back)
    eyes_back_mm: 1.6
    # Muscle and bone relief along the surface normal: segments [lat, ant, up] -> [lat, ant, up] (mirrored), height
    # and Gaussian half-width (mm); a negative height is a groove.
    ridges:
      - { a: [60, -92, -62], b: [16, -36, -188], h: 7.0, w: 13 }     # sternocleidomastoid, sternal head
      - { a: [64, -112, -82], b: [50, -100, -172], h: -2.8, w: 11 }  # the posterior triangle behind it
      - { a: [58, -96, -70], b: [38, -48, -192], h: 3.2, w: 10 }     # its clavicular head
      - { a: [44, -60, -150], b: [30, -40, -175], h: -2.4, w: 6 }   # the groove between the heads
      - { a: [22, -40, -198], b: [140, -95, -192], h: 2.4, w: 7 }   # clavicle
      - { a: [17, 17, -30], b: [20, 13, -41], h: -1.4, w: 2.2 }      # alar groove
      - { a: [20, 13, -41], b: [13, 17, -48], h: -1.4, w: 2.2 }
      - { a: [14, 22, 2], b: [40, 4, 4], h: -1.2, w: 2.5 }          # upper lid crease
      - { a: [26, -152, -92], b: [130, -120, -178], h: 3.0, w: 16 }  # upper trapezius border
  # The groom (pipeline/blender/groom.py): a short textured cut, longer and lifted on top, tapered sides and nape.
  # Angles (theta) run around the head's vertical axis (`axis_ant` mm in front of the eyes... behind, when negative):
  # 0 in front, 90 over the ear, 180 the nape. Heights are mm above the eyes.
  hair:
    seed: 20261006
    strands: 70000
    points: 8
    width_mm: [0.14, 0.035]       # root and tip (the stage keeps every strand at least about a pixel wide)
    axis_ant: -72
    hairline:
      theta: [0, 20, 30, 38, 46, 54, 62, 70, 77, 81, 84, 87, 92, 108, 113, 117, 125, 140, 160, 180]
      up: [66, 64, 58, 52, 46, 34, 27, 23, 20, 13, 10, 22, 27, 28, 18, -10, -30, -48, -58, -62]
      soft_mm: 7
      wobble_mm: 3.5
    ear_clear_mm: [24, 32]        # from the ear's root centre: no hair inside the first, full density past the second
    length_mm:
      edge: 3
      side: 10
      side_rise_mm: 22
      back: 8
      back_rise_mm: 40
      top_theta: [0, 60, 120, 180]
      top: [32, 28, 21, 14]
      top_from_up: 38
      top_full_up: 62
      hairline_mm: 6
    lift: { theta: [0, 30, 90, 150, 180], deg: [44, 34, 24, 12, 8], side_deg: 3 }
    comb: { crown_theta: [130, 165], front_up_theta: [10, 60] }   # up and back at the front, back over the top
    shape: { settle: 0.5, bend: 0.34, root_lift_mm: 0.2, frizz_mm: 0.9, frizz_cycles: 2.0, min_above_mm: 0.3 }
    clump: { per_clump: 30, converge: 0.7, power: 2.0, per_clump_brow: 4, converge_brow: 0.3 }
    flyaway: { fraction: 0.006, length: 1.15, lift_mm: 2 }
    locks: { length_sigma: 0.15, lift_sigma: 0.22, turn_deg: 16 }   # per clump
    brows:
      strands: 1800
      lat: [10, 22, 34, 46]
      up: [11, 13, 12, 8]
      half_mm: [4, 3.5, 2.8, 1.6]
      density: [0.9, 0.9, 0.75, 0.4]
      length_mm: 5
      lift_deg: 2
      width_mm: 0.06
    lashes:
      strands: 260
      length_mm: 6
      lift_deg: 62
      width_mm: 0.05
  # Skin maps (pipeline/blender/skin.py): colours are linear RGB; lengths mm.
  skin:
    texture_px: 4096
    head_density: 1.6         # texel density of the head's UV islands relative to the body's
    cage_mm: 3
    ray_mm: 6
    base: [0.62, 0.34, 0.24]
    broad: 0.18               # centimetre-scale uneven pigment (+-)
    mottle: 0.08
    red_tint: [1.08, 0.82, 0.82]
    red: 0.45
    beard_tint: [0.74, 0.74, 0.8]
    beard: 0.75
    stubble_mm: 1.0
    stubble_colour: [0.05, 0.043, 0.04]
    stubble: 0.85
    stubble_relief: 0.4
    lips: [0.42, 0.18, 0.14]
    lid_tint: [0.85, 0.75, 0.78]
    freckle_below_mm: 170
    scalp_colour: [0.05, 0.042, 0.038]
    scalp: 0.85
    pore_mm: 0.65
    roughness: 0.5
    tz_gloss: 0.16
    lines: 0.15
    relief_mm: 0.3
    grain_mm: 1.1
    grain: 0.45
  # The handoff (pipeline/blender/handoff.py): landmark warp, closest point on the fitted exterior, smoothing.
  handoff:
    smooth_iters: 12
    canal_from_root_mm: [4, 18]   # ant, up: the ear canal from the helix's root centre (hero.py ear_roots)
  crop:
    below_eye_mm: 430
    half_width_mm: 420
  # The opening's framing (frame.json `portrait_bust`, a box the camera fits as a sphere: 01-face.mdx frames it at
  # zoom 0.92 with a 28 degree vertical field): from the goal reference's composition, the head (crown to chin) fills
  # about half the frame's height, the frame's centre lies this far below the crown and behind the head's middle.
  frame:
    crown_allowance_mm: 14   # the hair above the scalp
    centre_below_crown_mm: 142
    centre_behind_mm: 12
    radius_mm: 197

# Pieces (pieces.py): the completed gland is cut into closed pieces so that resections can lift exactly the tissue
# each operation removes (plan §8). ESGS levels (Quer 2016): I lateral superior, II lateral inferior, III deep
# inferior, IV deep superior, V accessory. Lateral/deep is the facial-nerve plane (surfaces.py); cranial/caudal is
# a surface through the buccal branch, between the temporal/zygomatic branches above and the marginal mandibular
# and cervical branches below (Pujol-Olmo 2020: the temporal and zygomatic branches lie between the cranial levels,
# the cervical and marginal between the caudal ones; the buccal branches lie between them or either side). Control
# points are (y, z) mm of the boundary, read off the authored buccal branch and the divisions' levels.
pieces:
  cranial_boundary: [[60, 246], [71, 245], [77, 243], [88, 247], [102, 249], [120, 247]]
  # ECD removes the tumour with a rim of normal gland, on the lateral side of the nerve plane only. The width is
  # illustrative (not a measured margin).
  cuff_mm: 3.0
  # Neighbouring pieces are meshed a little proud of the 0.5 iso-level so they overlap slightly instead of leaving
  # cracks where they meet on the outer surface; the overlap is inside the gland.
  mesh_level: 0.42
  sigma: 0.8
  smooth_iter: 6
  ink_scale_mm: 8     # signed distances in the _INK attribute are stored as mm / ink_scale_mm, clipped to [-1, 1]
  probe_mm: 0.9               # a triangle is a cut face when the point this far outside it, along its normal, is in another piece
  budgets: { parotid_level_1: 5000, parotid_level_2: 9500, parotid_ecd_cuff: 4500, parotid_level_3: 6000, parotid_level_4: 3800 }

# Accessory parotid lobule (ESGS level V): present in 32.1% of people in a pooled analysis (Rosa 2020) and 9 of 19
# dissected glands (Pujol-Olmo 2020), under 5% of the gland's weight when present. Lies on the masseter above the
# duct, anterior to the main gland. Authored from those figures, not from the CT.
accessory_lobe:
  near: [70, 110, 242]
  offset_mm: 2.6
  radii: [3.0, 6.5, 4.2]
  seed: 31

# Nerve mobilisation for the total-parotidectomy plates (schematic): the facial-nerve branches are lifted off the deep
# lobe so that it can be delivered from beneath them. The weight baked per vertex (`mob`) rises from the first division
# to full over these distances (mm from the pes); the stage displaces by weight * the plate's `mobilise`.
mobilisation:
  start_mm: 3
  full_mm: 22

# Alternate placements of the adenoma (extras.py): the same size class, placed by a constrained search near each target:
# clear of the facial nerve and vessels, off bone and muscle, and (deep, tail) inside that part of the gland. Placement
# only; how common each position is comes from the literature. Targets in RAS mm.
tumour_alternates:
  deep: { target: [54, 70, 231], radii: [4.5, 5.5, 5.5], seed: 41, need: deep, min_fraction: 0.5, search_mm: 6, min_nerve_clearance_mm: 1.2, min_vessel_clearance_mm: 0.8, min_bone_muscle_clearance_mm: 0.4, min_skin_cover_mm: 2.3 }
  tail: { target: [67, 92, 207], keep: [69.5, 88.5, 220.0], radii: [5.4, 6.3, 6.7], seed: 43, need: tail, min_fraction: 0.45, search_mm: 14, min_nerve_clearance_mm: 1.2, min_vessel_clearance_mm: 0.8, min_bone_muscle_clearance_mm: 0.4, min_skin_cover_mm: 2.2 }
  # The accessory lobule lies only 4.6 mm under the skin, so a tumour of this size class cannot keep the 2 mm cover the face-fit rule asks
  # of other structures (it sits about 1.4 mm under the skin of the voxel body mask and is not constrained by the fitted face): it is excluded from that depth check (face.depth_check_exclude).
  accessory: { target: [70.5, 111, 242], radii: [4.2, 5.2, 4.6], seed: 47, need: accessory, min_fraction: 0.0, search_mm: 8, min_nerve_clearance_mm: 0.8, min_vessel_clearance_mm: 0.8, min_bone_muscle_clearance_mm: 0.3 }

# Frey-syndrome regrowth schematic (extras.py): thin fibres from the cut auriculotemporal nerve to the skin over the former
# gland, in the line grammar. Not anatomy: an illustration of the mechanism (claim frey-mechanism).
frey:
  fibres: 18
  radius_mm: 0.16
  seed: 61
  root_fraction: 0.5
  zone_centre: [0, 88, 242]
  zone_radii: [24, 22]
  x_min: 68
  under_skin_mm: 2.0

# Risk territories drawn on the skin in the Complications chapter (stage ZONE_SLOTS): hatched ellipsoids, a simplification
# of where each complication is felt, not measured boundaries. Centres are RAS mm; `lateral: true` puts the centre on the
# most lateral skin at that (y, z). Radii are [lateral, y, z] mm. Several ellipsoids may share a weight (an op `zone_<weight>`).
# Sources for what each territory represents: great auricular nerve (claim great-auricular-nerve-course), marginal mandibular
# branch to the lower lip (claim mm-lower-lip), temporal branch to the forehead (claim fn-branch-targets), Frey syndrome over
# the preauricular skin and parotid region (claim frey-mechanism), first-bite pain in the parotid region.
zones:
  ear_a: { centre: [null, 64, 232], radii: [12, 12, 13], lateral: true, weight: ear }
  ear_b: { centre: [null, 84, 215], radii: [12, 17, 14], lateral: true, weight: ear }
  lip: { centre: [14, 178, 196], radii: [16, 10, 12], weight: lip }
  forehead: { centre: [32, 152, 300], radii: [22, 16, 15], weight: forehead }
  frey: { centre: [null, 88, 243], radii: [12, 26, 23], lateral: true, weight: frey }
  bite: { centre: [null, 84, 236], radii: [12, 15, 16], lateral: true, weight: bite }

# Instruments, imaging planes and the drain (props.py). Everything here is illustrative: the needle and the transducer are
# placed over the representative tumour, the drain follows the description in the Iowa protocol (a flat perforated drain
# through a separate stab wound in the neck, away from the nerve), and the CT slice is the donor's own normal anatomy.
props:
  needle: { direction: [1.0, 0.22, 0.05], tip_inside_mm: 1.0, shaft_outside_mm: 30, hub_mm: 9, barrel_mm: 36, plunger_mm: 24, radius_mm: 0.34 }
  ultrasound: { offset_y_mm: 0, offset_z_mm: 0, thickness_mm: 10, width_mm: 38, round_mm: 2.5, height_mm: 24, plane_width_mm: 38, plane_depth_mm: 44 }
  imaging: { x_mm: [18, 104], y_mm: [38, 128], level: 45, window: 380, upsample: 2.5, fade_px: 14, dash_mm: [2.4, 1.6] }
  drain: { radius_mm: 1.7, exit_yz_mm: [52, 192], bed_nodes_mm: [[62, 86, 222], [60, 78, 212], [57, 70, 202]] }

# Closure barriers (barriers.py): the SMAS flap, a strip of the sternocleidomastoid turned up on its upper end, and a thin graft
# sheet on the bed. Illustrative geometry for the closure plates (claim barrier-options). The sialocele pocket is a schematic
# collection of saliva under the flap for the complications chapter.
barriers:
  smas: { lateral_of_plane_mm: 3, normal_x_min: 0.3, offset_mm: 0.7 }
  graft: { cutface_min: 0.7, normal_x_min: 0.2, offset_mm: 0.9 }
  scm: { z_range_mm: [165, 240], posterior_fraction: 0.5 }
  sialocele: { centre: [77, 86, 226], radii: [5.5, 15, 13], seed: 53 }
  # Recurrent pleomorphic adenoma is typically multinodular (claim recurrence-factors): a few small nodules in the bed where the
  # tumour lay, drawn as a schematic cluster (offsets from the tumour centre, mm; RAS: -x is medial).
  recurrence: { offsets_mm: [[-9, 2, 3], [-11, -7, -3], [-7, 10, -4], [-12, 4, -9]], radii_mm: [3.4, 2.7, 2.3, 1.9], seed: 71 }
